; SIM firmware: one codebase, five build environments, one per SIM variant.
; Selecting an environment selects which sensor modules compile in (via the
; -DSENSOR_* flags) and which pin block in include/pins.h applies (via
; -DSIM_VARIANT). The firmware team changes pins in include/pins.h only.
;
; Build examples:
;   pio run -e sim1_onewire
;   pio run -e sim2_i2c -t upload
;   pio device monitor -b 115200

[platformio]
default_envs = sim1_onewire

[env]
platform = espressif32                 ; Arduino-ESP32 core; BLE + NVS bundled
framework = arduino
monitor_speed = 115200
build_flags =
    -DKIT_ID=1                         ; kit identity; change per assembled kit or override per env
    -DCORE_DEBUG_LEVEL=0               ; silence core logs; the firmware's own serial output is the console
lib_deps =
    paulstoffregen/OneWire@^2.3.7      ; harmless to link on all variants; only sim1 uses it
    milesburton/DallasTemperature@^4.0.4

[env:sim1_onewire]
build_flags = ${env.build_flags}
    -DSIM_VARIANT=1
    -DSENSOR_DS18B20                   ; One-Wire temperature, sensor_type_id 1

[env:sim2_i2c]
build_flags = ${env.build_flags}
    -DSIM_VARIANT=2
    -DSENSOR_BME688                    ; type 2: needs Bosch BSEC for real IAQ, see bme688_mod.cpp
    -DSENSOR_SCD41                     ; type 6: raw-I2C driver, no vendor lib needed
    -DSENSOR_VEML7700                  ; type 7: raw-I2C driver, no vendor lib needed

[env:sim3_gpio]
build_flags = ${env.build_flags}
    -DSIM_VARIANT=3
    -DSENSOR_PIR                       ; type 3
    -DSENSOR_REED                      ; type 10
    -DSENSOR_AT42QT1010                ; type 14

[env:sim4_analog]
build_flags = ${env.build_flags}
    -DSIM_VARIANT=4
    -DSENSOR_ANALOG_420MA              ; type 4
    -DSENSOR_SPL                       ; type 8
    -DSENSOR_JSN_SR04T                 ; type 9: pulse capture, needs two GPIO on the connector
    -DSENSOR_SCT013                    ; type 11
    -DSENSOR_SEN0193                   ; type 12
    -DSENSOR_WATER_TRACE               ; type 13

[env:sim5_rs485]
build_flags = ${env.build_flags}
    -DSIM_VARIANT=5
    -DSENSOR_RS485_METER               ; type 5: Modbus RTU energy meter
